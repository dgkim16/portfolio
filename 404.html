<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- fallback when JS is off; JS redirects first at 5 s -->
<meta http-equiv="refresh" content="6;url=https://dgkim16.github.io/">
<link rel="canonical" href="https://dgkim16.github.io/">
<title>Portfolio moved · Donghwan Kim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090d;
    --ink: #e8edf2;
    --muted: #93a1b0;
    --accent: #6fd3c1;
    --panel: rgba(10, 14, 20, 0.62);
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 100%, #10202a 0%, var(--bg) 60%);
    color: var(--ink);
    font: 400 16px/1.6 "IBM Plex Sans", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    overflow: hidden;
  }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  main {
    position: relative;
    z-index: 1;
    width: min(520px, 100%);
    padding: 32px 32px 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }
  .eyebrow {
    margin: 0 0 14px;
    font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { margin: 0 0 10px; font-size: clamp(22px, 5vw, 28px); font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
  .count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
  a:hover, a:focus-visible { color: var(--accent); }
  .bar { height: 2px; margin-top: 22px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: drain 5s linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .bar > span { animation: none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <p class="eyebrow">Portfolio moved</p>
  <h1>Redirecting to the newer version of my portfolio in <span class="count" id="count">5</span>&nbsp;<span id="unit">seconds</span>.</h1>
  <p>Thank you for your interest!</p>
  <p>If the redirect doesn't work, please use this link: <a href="https://dgkim16.github.io/">https://dgkim16.github.io/</a></p>
  <div class="bar" aria-hidden="true"><span></span></div>
</main>

<script>
  // countdown runs without WebGL or the Three.js download
  (function () {
    var target = "https://dgkim16.github.io/";
    var end = Date.now() + 5000;
    var count = document.getElementById("count");
    var unit = document.getElementById("unit");
    function tick() {
      var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      count.textContent = left;
      unit.textContent = left === 1 ? "second" : "seconds";
      if (left === 0) { location.replace(target); return; }
      setTimeout(tick, 200);
    }
    tick();
  })();
</script>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
<script type="module">
  import * as THREE from "three";

  const canvas = document.getElementById("bg");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: "low-power" });
  } catch (e) {
    canvas.remove(); // no WebGL: the CSS gradient stays
    throw e;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);

  // a scanned terrain: jittered grid of points with layered-wave heights, like a LiDAR sweep
  const N = innerWidth < 700 ? 140 : 220;
  const size = 60;
  const pos = new Float32Array(N * N * 3);
  let k = 0;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const x = (i / (N - 1) - 0.5) * size + (Math.random() - 0.5) * 0.18;
      const z = (j / (N - 1) - 0.5) * size + (Math.random() - 0.5) * 0.18;
      const y = 1.6 * Math.sin(x * 0.18) * Math.cos(z * 0.15)
              + 0.7 * Math.sin(x * 0.45 + z * 0.3)
              + 0.25 * Math.sin(x * 1.3) * Math.sin(z * 1.1);
      pos[k++] = x; pos[k++] = y; pos[k++] = z;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPx: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */ `
      uniform float uTime, uPx;
      varying float vH, vScan, vFade;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uPx * 3.2 * (18.0 / -mv.z);
        vH = position.y;
        float front = mod(uTime * 9.0, 90.0) - 45.0;          // scan line sweeping along x
        vScan = exp(-pow((position.x - front) * 0.6, 2.0));
        vFade = smoothstep(30.0, 6.0, length(position.xz));   // soften the edges
      }`,
    fragmentShader: /* glsl */ `
      varying float vH, vScan, vFade;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        if (dot(c, c) > 0.25) discard;
        vec3 low = vec3(0.16, 0.32, 0.52), high = vec3(0.44, 0.83, 0.76);
        vec3 col = mix(low, high, smoothstep(-2.0, 2.4, vH));
        col += vec3(0.9, 1.0, 0.95) * vScan;
        gl_FragColor = vec4(col, (0.55 + vScan * 0.45) * vFade);
      }`,
  });
  scene.add(new THREE.Points(geo, mat));

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();

  function frame(t) {
    const s = t * 0.001;
    const a = 0.6 + s * 0.05;
    camera.position.set(Math.cos(a) * 21, 8, Math.sin(a) * 21);
    camera.lookAt(0, -3, 0);
    mat.uniforms.uTime.value = s;
    renderer.render(scene, camera);
  }
  if (still) frame(1800); else renderer.setAnimationLoop(frame);
</script>
</body>
</html>
